<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP画像の元データ（1200×630）</title>
<!-- assets/ogp.png はこのファイルをヘッドレスChromeで1200×630でスクリーンショットして作る。
     再生成コマンド:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=assets/ogp.png file://<絶対パス>/assets/ogp-source.html -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: linear-gradient(135deg, #9a1f60 0%, #c2287a 45%, #7b4fd6 100%);
    color: #fff; position: relative;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .inner { position: relative; padding: 58px 74px 116px; height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 22px; }
  .top svg { width: 86px; height: 86px; }
  .pref { font-size: 25px; letter-spacing: 0.3em; color: #a9e3d8; }
  .en { font-size: 19px; letter-spacing: 0.34em; color: #9fb8d4; margin-top: 4px; }
  h1 { font-size: 96px; font-weight: 700; letter-spacing: 0.04em; margin-top: 40px; line-height: 1.15; }
  .catch { font-size: 34px; margin-top: 24px; color: #dcefec; letter-spacing: 0.05em; }
  .tags { margin-top: auto; display: flex; gap: 12px; align-items: center; }
  .tags span {
    border: 2px solid rgba(255,255,255,0.55); border-radius: 999px;
    font-size: 22px; padding: 6px 22px; color: #fff;
  }
  .fiction {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fff6e0; color: #6b4c10; border-top: 5px solid #e0a93a;
    font-size: 24px; padding: 16px 74px; letter-spacing: 0.01em; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="inner">
  <div class="top">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#ffcb47" stroke="#fff" stroke-width="2"/><text x="32" y="42" text-anchor="middle" font-size="30" font-weight="900" fill="#a3006b" font-family="Hiragino Maru Gothic ProN, sans-serif">擬</text></svg>
    <div>
      <div class="pref">擬 野 流 県 擬 野 流 市</div>
      <div class="en">GYARU CITY OFFICIAL WEBSITE</div>
    </div>
  </div>
  <h1>擬野流市公式サイト</h1>
  <p class="catch">盛れる学びは、盛れる人生をつくる。</p>
  <div class="tags">
    <span>AI窓口24時間</span><span>手続き97%オンライン</span><span>テンションチェック毎朝</span>
  </div>
</div>
<div class="fiction">研修・動画教材用に作られた架空の都市です（実在の自治体とは関係ありません）</div>
</body>
</html>
